<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>Каталог — mnogogrannik.lab</title>
	<meta name="robots" content="noindex, follow">
	<link rel="canonical" href="https://mnogogrannik.by/catalog/">
	<script>
		(function () {
			var path = location.pathname || '';
			// Этот файл — только legacy entrypoint. Если его отдают по pretty URL
			// (/catalog/{slug}/) через rewrite, location.replace() на тот же путь
			// даёт ERR_TOO_MANY_REDIRECTS.
			if (!/\/catalog\.html$/i.test(path)) return;

			var map = {
				"loft-furniture": { "slug": "loft-mebel", "subs": { "stoly": "stoly", "stulya": "stulya", "divany": "divany", "krovati": "krovati", "kresla": "kresla", "skameiki": "skameiki", "stellazhi": "stellazhi", "garderobnye": "garderobnye", "polki": "polki", "vinnye-bary": "vinnye-bary", "stoiki": "stoiki" } },
				"garden-furniture": { "slug": "sadovaya-mebel", "subs": { "kacheli": "kacheli", "besedki": "besedki", "obed": "obed", "lavki": "lavki" } },
				"car-canopies": { "slug": "navesy-dlya-mashiny", "subs": {} },
				"kozyrek-loft": { "slug": "kozyrek-loft", "subs": {} },
				"mangal-zones": { "slug": "mangal-zony", "subs": { "mangaly": "mangaly", "mangal-zony": "mangal-zony", "kostrovye": "kostrovye", "drovnicy": "drovnicy" } },
				"stairs": { "slug": "lestnicy", "subs": { "marshevye": "marshevye", "vintovye": "vintovye", "karkas": "karkas", "perila": "perila" } },
				"gates-fences": { "slug": "vorota-i-zabory", "subs": { "vorota": "vorota", "kalitki": "kalitki", "zabory": "zabory" } },
				"art-decor": { "slug": "art-dekor", "subs": { "int-art": "int-art", "ul-art": "ul-art" } },
				"playgrounds": { "slug": "detskie-ploshchadki", "subs": { "igrovye": "igrovye", "kacheli-det": "kacheli-det", "sport": "sport" } },
				"dog-cages": { "slug": "kletki-dlya-sobak", "subs": {} },
				"window-grilles": { "slug": "reshetki-na-okna", "subs": {} }
			};
			var hash = (location.hash || "").replace(/^#/, "");
			var parts = hash.split("/").filter(Boolean);
			var target = "/catalog/";
			if (parts.length) {
				var section = map[parts[0]];
				if (section) {
					target = "/catalog/" + section.slug + "/";
					var subSlug = parts[1] && section.subs[parts[1]];
					if (subSlug) target += subSlug + "/";
					if (parts[2] && /^c\d+$/i.test(parts[2])) {
						target += "?pid=" + encodeURIComponent(parts[2].toLowerCase());
					}
				}
			}
			location.replace(target);
		}());
	</script>
	<noscript>
		<meta http-equiv="refresh" content="0; url=/catalog/">
	</noscript>
</head>
<body>
	<p><a href="/catalog/">Перейти в каталог</a></p>
</body>
</html>
